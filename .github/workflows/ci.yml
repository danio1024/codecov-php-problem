name: Workflow for Codecov example-php
on: [push, pull_request]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up php 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
      - name: Install dependencies
        run: composer self-update && composer install && composer dump-autoload
      - name: Run tests and collect coverage
        run: vendor/bin/phpunit --testsuite basic --coverage-clover coverage-basic.xml
      - name: Run tests and collect coverage
        run: vendor/bin/phpunit --testsuite other --coverage-clover coverage-other.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-basic.xml
          flags: basic # optional
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_ORG_TOKEN }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-other.xml
          flags: other # optional
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_ORG_TOKEN }}
      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.xml